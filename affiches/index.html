<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Affiches IZAMPEPTIDE</title>
<style>
:root{--night:#070b1a;--ink:#f4f7ff;--soft:#a9b4d6;--teal:#2de1c2;--violet:#8b5cf6;--pink:#f472b6;--gold:#fbbf24}
*{box-sizing:border-box;margin:0}
body{background:#0e1224;font-family:"Inter",system-ui,sans-serif;color:var(--ink)}
.gallery{display:flex;flex-wrap:wrap;gap:24px;justify-content:center;padding:32px 16px}
.gallery h1{width:100%;text-align:center;font-weight:800;letter-spacing:.04em}
.frame{width:360px;height:450px;overflow:hidden;border-radius:16px;box-shadow:0 20px 60px #0008}
.frame .poster{transform:scale(.3333);transform-origin:0 0}
body.solo{background:var(--night)}
body.solo .gallery{padding:0;gap:0;display:block}
body.solo .gallery h1,body.solo .frame:not(.show){display:none}
body.solo .frame{width:1080px;height:1350px;border-radius:0;box-shadow:none}
body.solo .frame .poster{transform:none}

/* ---------- POSTER ---------- */
.poster{width:1080px;height:1350px;position:relative;overflow:hidden;background:var(--night);padding:90px 84px;display:flex;flex-direction:column}
.poster::before{content:"";position:absolute;inset:-20%;background:
  radial-gradient(circle at 20% 15%,color-mix(in srgb,var(--c1) 45%,transparent),transparent 45%),
  radial-gradient(circle at 85% 80%,color-mix(in srgb,var(--c2) 40%,transparent),transparent 45%);
  animation:drift 9s ease-in-out infinite alternate;z-index:0}
.poster::after{content:"";position:absolute;inset:0;background-image:linear-gradient(#ffffff08 1px,transparent 1px),linear-gradient(90deg,#ffffff08 1px,transparent 1px);background-size:54px 54px;z-index:0}
.poster>*{position:relative;z-index:1}
@keyframes drift{to{transform:translate(4%,-3%) rotate(6deg)}}

.brand{display:flex;align-items:center;gap:18px;font-weight:900;font-size:40px;letter-spacing:.08em;animation:down .9s cubic-bezier(.2,.8,.2,1) both}
.brand i{width:46px;height:46px;border-radius:50%;background:conic-gradient(var(--c1),var(--c2),var(--c1));animation:spin 4s linear infinite;box-shadow:0 0 30px var(--c1)}
.brand b{color:var(--c1)}
.chip{margin-left:auto;font-size:22px;font-weight:700;letter-spacing:.05em;padding:10px 22px;border-radius:99px;border:2px solid var(--c1);color:var(--c1)}
@keyframes spin{to{transform:rotate(360deg)}}

/* chaîne d'acides aminés */
.chain{height:260px;margin:30px -84px 0;animation:float 4s ease-in-out infinite}
@keyframes float{50%{transform:translateY(16px)}}
.chain circle{animation:pulse 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.chain line{stroke:#ffffff40;stroke-width:6;stroke-dasharray:200;stroke-dashoffset:200;animation:draw 1.4s .3s ease forwards}
@keyframes pulse{0%,100%{transform:scale(.85)}50%{transform:scale(1.12)}}
@keyframes draw{to{stroke-dashoffset:0}}

.kicker{font-size:30px;font-weight:700;color:var(--c1);letter-spacing:.2em;text-transform:uppercase;animation:up .8s .5s both}
h2{font-size:112px;line-height:.95;font-weight:900;letter-spacing:-.02em;margin-top:14px;animation:up .9s .65s both}
h2 span{background:linear-gradient(90deg,var(--c1),var(--c2));-webkit-background-clip:text;background-clip:text;color:transparent}
.lead{font-size:34px;color:var(--soft);margin-top:24px;max-width:860px;line-height:1.35;animation:up .9s .85s both}
ul.points{list-style:none;padding:0;margin-top:40px;display:grid;gap:18px}
ul.points li{font-size:31px;display:flex;gap:18px;align-items:center;animation:left .7s both}
ul.points li:nth-child(1){animation-delay:1.05s}ul.points li:nth-child(2){animation-delay:1.25s}ul.points li:nth-child(3){animation-delay:1.45s}
ul.points li::before{content:"";flex:none;width:18px;height:18px;border-radius:50%;background:var(--c1);box-shadow:0 0 18px var(--c1)}

.bottom{margin-top:auto;padding-top:36px;display:flex;align-items:flex-end;justify-content:space-between;gap:30px}
.price{background:linear-gradient(135deg,var(--c1),var(--c2));color:var(--night);border-radius:36px;padding:26px 44px;animation:pop .8s 1.7s cubic-bezier(.3,1.6,.5,1) both,glow 2.5s 2.5s ease-in-out infinite}
.price small{display:block;font-size:24px;font-weight:700;opacity:.8}
.price strong{font-size:110px;font-weight:900;line-height:1}
.price strong sup{font-size:50px}
.legal{font-size:20px;color:var(--soft);max-width:430px;text-align:right;line-height:1.4;animation:up .8s 2s both}
.legal b{color:var(--ink)}
@keyframes pop{from{transform:scale(0) rotate(-8deg);opacity:0}}
@keyframes glow{50%{box-shadow:0 0 70px color-mix(in srgb,var(--c1) 70%,transparent)}}
@keyframes up{from{opacity:0;transform:translateY(50px)}}
@keyframes down{from{opacity:0;transform:translateY(-40px)}}
@keyframes left{from{opacity:0;transform:translateX(-60px)}}

/* thèmes */
.p-launch{--c1:var(--teal);--c2:var(--violet)}
.p-derma{--c1:#5eead4;--c2:var(--pink)}
.p-meta{--c1:var(--gold);--c2:#fb7185}
.p-joint{--c1:#60a5fa;--c2:var(--teal)}
.p-care{--c1:#a78bfa;--c2:#34d399}
.p-launch h2{font-size:128px}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:46px}
.steps div{border:2px solid #ffffff22;border-radius:26px;padding:26px;background:#ffffff08;font-size:26px;color:var(--soft);animation:up .7s both}
.steps div:nth-child(1){animation-delay:1.1s}.steps div:nth-child(2){animation-delay:1.3s}.steps div:nth-child(3){animation-delay:1.5s}
.steps b{display:block;font-size:56px;color:var(--c1);font-weight:900}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-top:44px}
.duo div{border:2px solid #ffffff22;border-radius:30px;padding:34px;background:#ffffff08;animation:up .8s both}
.duo div:nth-child(1){animation-delay:1.1s}.duo div:nth-child(2){animation-delay:1.35s}
.duo h3{font-size:40px;font-weight:800}
.duo p{font-size:26px;color:var(--soft);margin:12px 0 22px;line-height:1.35}
.duo strong{font-size:72px;font-weight:900;color:var(--c1)}
.p-offer{--c1:#f472b6;--c2:var(--gold)}
.p-ship{--c1:#38bdf8;--c2:#a78bfa}
.p-order{--c1:var(--teal);--c2:#60a5fa}
.p-law{--c1:#34d399;--c2:#f87171}
.rows{display:grid;gap:16px;margin-top:40px}
.rows div{display:flex;justify-content:space-between;align-items:center;gap:20px;border:2px solid #ffffff22;border-radius:24px;padding:22px 30px;background:#ffffff08;font-size:30px;animation:left .7s both}
.rows div:nth-child(1){animation-delay:1.05s}.rows div:nth-child(2){animation-delay:1.25s}.rows div:nth-child(3){animation-delay:1.45s}.rows div:nth-child(4){animation-delay:1.65s}
.rows strong{font-size:44px;font-weight:900;color:var(--c1);white-space:nowrap}
.rows small{display:block;font-size:22px;color:var(--soft)}
.steps.four{grid-template-columns:repeat(2,1fr)}
.steps div:nth-child(4){animation-delay:1.7s}
.vs{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:34px}
.vs>div{border-radius:28px;padding:26px 28px;animation:up .8s both}
.vs>div:first-child{border:2px solid #f8717166;background:#f8717112;animation-delay:1.1s}
.vs>div:last-child{border:2px solid #34d39966;background:#34d39912;animation-delay:1.35s}
.vs h3{font-size:30px;font-weight:800;margin-bottom:16px}
.vs>div:first-child h3{color:#f87171}.vs>div:last-child h3{color:#34d399}
.vs li{font-size:23px;line-height:1.3;margin-bottom:12px;color:var(--ink)}
.vs ul{padding-left:26px}
.p-brand{--c1:var(--teal);--c2:var(--pink)}
.p-brand .chain{display:none}
.p-brand .kicker{margin-top:70px}
.pillars{display:grid;gap:22px;margin-top:40px}
.pillars>div{display:flex;gap:28px;align-items:flex-start;border:2px solid #ffffff22;border-radius:30px;padding:28px 32px;background:#ffffff08;animation:left .7s both}
.pillars>div:nth-child(1){animation-delay:1.05s}.pillars>div:nth-child(2){animation-delay:1.3s}.pillars>div:nth-child(3){animation-delay:1.55s}
.pillars i{flex:none;font-style:normal;font-size:56px;width:96px;height:96px;border-radius:26px;display:grid;place-items:center;background:linear-gradient(135deg,var(--c1),var(--c2))}
.pillars h3{font-size:40px;font-weight:900}
.pillars p{font-size:25px;color:var(--soft);margin-top:8px;line-height:1.35}
</style>
</head>

function chain(seed) {
  const n = 9, w = 1080, out = [];
  for (let i = 0; i < n; i++) {
    const x = 70 + i * (w - 140) / (n - 1), y = 150 + Math.sin(i * 1.1 + seed) * 70;
    out.push({ x, y, r: 26 + ((i * 7 + seed * 3) % 5) * 6 });
  }
  const lines = out.slice(1).map((p, i) => `<line x1="${out[i].x}" y1="${out[i].y}" x2="${p.x}" y2="${p.y}"/>`).join("");
  const dots = out.map((p, i) => `<circle cx="${p.x}" cy="${p.y}" r="${p.r}" fill="${i % 2 ? "var(--c2)" : "var(--c1)"}" opacity=".9" style="animation-delay:${-i * .27}s;filter:drop-shadow(0 0 14px ${i % 2 ? "var(--c2)" : "var(--c1)"})"/>`).join("");
  return `<svg class="chain" viewBox="0 0 1080 300">${lines}${dots}</svg>`;
}

const g = document.getElementById("gallery");

});
